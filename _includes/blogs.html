<!-- Blogs -->
<section class="page-section" id="{{ site.data.sitetext[site.locale].blogs.section | default: "blogs" }}">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading text-uppercase">{{ site.data.sitetext[site.locale].blogs.title }}</h2>
        <h3 class="section-subheading text-muted">{{ site.data.sitetext[site.locale].blogs.text }}</h3>
      </div>
    </div>
    <div class="row">
      {% for post in site.posts limit:3 %}
      <div class="col-md-4 col-sm-6 blogs-item">
        <a class="blogs-card card-{{ forloop.index }}" href="{{ post.url | relative_url }}">
          <div class="blogs-image-container">
            {% if post.image %}
            <img class="img-fluid" src="{{ post.image | relative_url }}" alt="{{ post.title }}">
            {% else %}
            <!-- Placeholder if no image -->
            <div style="aspect-ratio: 4/3; background: #ccc;"></div>
            {% endif %}
          </div>
          <div class="blogs-content">
            <span class="blogs-subtitle">{{ post.subtitle }}</span>
            <h4 class="blogs-title">
              {{ post.title }}
            </h4>
          </div>
          <div class="blogs-footer">
            <div class="blogs-date">{{ post.date | date: "%m/%d/%Y" }}</div>
          </div>
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<!-- End Blogs -->
