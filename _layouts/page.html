---
layout: default
---
<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Highlight "Blogs" tab if it's a blogging page
    {% if page.categories contains 'blogging' %}
    var navLinks = document.querySelectorAll(".nav-link");
    navLinks.forEach(function(link) {
      if (link.textContent.trim() === "Blogs" || link.getAttribute("href").includes("#blogs")) {
        link.classList.add("active-section");
        link.style.color = "{{ site.data.style.highlight | default: '#fed136' }}";
      }
    });
    {% endif %}
  });
</script>

{% if page.background == "grey" or page.background == "gray" %}
<script>
document.getElementById("page-top").className="bg-light";
</script>
{% endif %}

<div id="content-container">
  <div class="container" id="pagecontainer" style="padding-top: 150px; padding-bottom: 100px;">
    <div class="row">
      <div class="col-lg-8 mx-auto">
        {% if page.categories contains 'blogging' %}
          <h2 class="section-heading text-uppercase">{{ page.title }}</h2>
          <p class="text-muted">{{ page.date | date: "%B %d, %Y" }}</p>
          <hr>
        {% endif %}
        {{ content }}
        
        {% if page.categories contains 'blogging' %}
          <div class="mt-5">
            <a class="btn btn-primary" href="{{ site.baseurl }}/#blogs">Back to Blogs</a>
          </div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
